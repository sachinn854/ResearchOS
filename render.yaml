services:
  - type: keyvalue
    name: researchos-redis
    plan: free
    maxmemoryPolicy: allkeys-lru
    ipAllowList:
      - source: 0.0.0.0/0
        description: everywhere

  - type: web
    name: researchos-backend
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    envVars:
      - key: POSTGRES_URL
        sync: false
      - key: POSTGRES_SCHEMA
        value: researchos
      - key: REDIS_URL
        fromService:
          name: researchos-redis
          type: keyvalue
          property: connectionString
      - key: OPENROUTER_API_KEY
        sync: false
      - key: LLM_MODEL
        value: openai/gpt-oss-120b
      - key: FAST_LLM_MODEL
        value: openai/gpt-oss-20b
      - key: TAVILY_API_KEY
        sync: false
      - key: QDRANT_URL
        sync: false
      - key: QDRANT_API_KEY
        sync: false
      - key: QDRANT_COLLECTION
        value: researchos_chunks
      - key: CORS_ORIGINS
        value: https://researchos-frontend-12i4.onrender.com
      - key: APP_ENV
        value: production
      - key: JWT_SECRET_KEY
        generateValue: true

  - type: web
    name: researchos-frontend
    runtime: docker
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: ./frontend
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_API_URL
        value: https://researchos-backend-5p2m.onrender.com

  - type: worker
    name: researchos-celery
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    dockerCommand: celery -A backend.workers.celery_app worker --loglevel=info -P solo -Q ingest,background
    envVars:
      - key: POSTGRES_URL
        sync: false
      - key: POSTGRES_SCHEMA
        value: researchos
      - key: REDIS_URL
        fromService:
          name: researchos-redis
          type: keyvalue
          property: connectionString
      - key: OPENROUTER_API_KEY
        sync: false
      - key: QDRANT_URL
        sync: false
      - key: QDRANT_API_KEY
        sync: false
      - key: QDRANT_COLLECTION
        value: researchos_chunks
      - key: APP_ENV
        value: production
      - key: JWT_SECRET_KEY
        generateValue: true
