name: Keep Alive

on:
  schedule:
    - cron: "*/5 * * * *"   # har 5 min
  workflow_dispatch:          # manual run button bhi

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests
      - run: python scripts/keep_alive.py --once
